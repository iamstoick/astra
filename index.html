<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Astra — Argus Dashboard</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <h1>Astra <span>argus dashboard</span></h1>
  <div class="spacer"></div>
  <button id="refreshAll">Refresh all</button>
  <label class="auto"><input type="checkbox" id="auto" checked> auto-refresh 15s</label>
</header>
<main>
  <p id="status">Add your Argus servers below, then press Connect all.</p>

  <section class="panel" id="serversPanel">
    <h2>Argus servers</h2>
    <div id="servers"></div>
    <div class="row">
      <button id="addServer">Add server</button>
      <button class="primary" id="connectAll">Connect all</button>
    </div>
  </section>

  <section id="dashboard" class="hidden">
    <div class="hero">
      <div class="hero-stat"><div class="v" id="serverCount">–</div><div class="k">servers up</div></div>
      <div class="hero-stat"><div class="v" id="projectCount">–</div><div class="k">projects connected</div></div>
      <div class="hero-stat"><div class="v" id="totalSymbols">–</div><div class="k">symbols indexed</div></div>
      <div class="hero-stat"><div class="v" id="totalFiles">–</div><div class="k">files indexed</div></div>
    </div>
    <div id="fleet"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
